worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" "$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    upstream checkout_backends {
        # Round-robin balancing across active API replicas
        server checkout-api-1:3000 max_fails=2 fail_timeout=5s;
        server checkout-api-2:3000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Nginx health check endpoint
        location /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"nginx-ingress"}';
        }

        # Main ingress routing to checkout API replicas
        location / {
            proxy_pass http://checkout_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass through RunSafe tracking headers from backends
            proxy_pass_header X-RunSafe-Version;
            proxy_pass_header X-RunSafe-Replica;

            # Resilient proxy timeouts
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;

            # Next upstream failover on 502/503/504
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
