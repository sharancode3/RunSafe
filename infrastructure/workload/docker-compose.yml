services:
  postgres:
    image: postgres:16-alpine
    container_name: runsafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: runsafe
      POSTGRES_PASSWORD: runsafe_secret
      POSTGRES_DB: checkout_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runsafe -d checkout_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - runsafe-net

  checkout-api-1:
    build:
      context: ../../
      dockerfile: apps/demo-workload/checkout-api/Dockerfile
    container_name: runsafe-checkout-api-1
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://runsafe:runsafe_secret@postgres:5432/checkout_db
      APP_VERSION: ${CHECKOUT_API_1_VERSION:-v1.0.0}
      REPLICA_ID: checkout-api-1
      ENVIRONMENT: ${ENVIRONMENT:-local}
      FAULT_PROFILE: ${CHECKOUT_API_1_FAULT:-none}
    ports:
      - "8081:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - runsafe-net

  checkout-api-2:
    build:
      context: ../../
      dockerfile: apps/demo-workload/checkout-api/Dockerfile
    container_name: runsafe-checkout-api-2
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://runsafe:runsafe_secret@postgres:5432/checkout_db
      APP_VERSION: ${CHECKOUT_API_2_VERSION:-v1.0.0}
      REPLICA_ID: checkout-api-2
      ENVIRONMENT: ${ENVIRONMENT:-local}
      FAULT_PROFILE: ${CHECKOUT_API_2_FAULT:-none}
    ports:
      - "8082:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - runsafe-net

  nginx:
    image: nginx:alpine
    container_name: runsafe-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      checkout-api-1:
        condition: service_healthy
      checkout-api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - runsafe-net

networks:
  runsafe-net:
    driver: bridge
